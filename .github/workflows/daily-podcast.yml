
name: Daily Orbit

on:
  schedule:
    - cron: "20 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate podcast
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_FEED_BASE_URL: ${{ vars.PUBLIC_FEED_BASE_URL }}
        run: python -m src.main

      - name: Commit RSS feed
        run: |
          git config user.name "Daily Orbit Bot"
          git config user.email "daily-orbit-bot@users.noreply.github.com"
          git add feed
          git diff --cached --quiet || git commit -m "Publish Daily Orbit episode"
          git push
